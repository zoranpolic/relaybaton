[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "relaybaton"
dynamic = ["version"]
description = "Pass the baton between AI coding agents: one source of instructions, an honest handoff log, and file ownership checks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zoran Polic" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["ai-agents", "agents-md", "claude-code", "codex", "copilot", "developer-tools", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/zoranpolic/relaybaton"
Issues = "https://github.com/zoranpolic/relaybaton/issues"
Changelog = "https://github.com/zoranpolic/relaybaton/blob/main/CHANGELOG.md"

[project.scripts]
baton = "relaybaton.cli:main"

[tool.hatch.version]
path = "src/relaybaton/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/relaybaton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["relaybaton"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603", "S607"]  # git is invoked with fixed argument lists, never a shell

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

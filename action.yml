name: relaybaton
description: Check that AI coding agent instruction files are in sync, the handoff log is fresh, and agents stayed out of each other's files.
author: Zoran Polic
branding:
  icon: repeat
  color: blue

inputs:
  command:
    description: 'The baton command to run, e.g. "check", "doctor", "handoff status" or "guard --agent codex --base origin/main".'
    required: false
    default: check
  python-version:
    description: Python version used to run relaybaton (3.11 or newer).
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install relaybaton
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --quiet "$ACTION_PATH"
    - name: Run baton
      shell: bash
      env:
        # Passed through the environment, never interpolated into the script,
        # so a crafted input cannot inject shell commands.
        BATON_COMMAND: ${{ inputs.command }}
      run: |
        read -r -a args <<< "$BATON_COMMAND"
        baton "${args[@]}"

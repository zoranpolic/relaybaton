name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --disable-pip-version-check -e . pytest==8.3.4 pytest-cov==6.0.0 ruff==0.8.6
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: python -m pytest --cov --cov-report=term-missing

  dogfood:
    name: baton check (this repository, via its own action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: check (default)
        uses: ./
        with:
          command: check
      - name: multi-word command
        uses: ./
        with:
          command: handoff list -n 1
      - name: guard against the base branch
        uses: ./
        with:
          command: guard --agent claude --base origin/main
      - name: shell metacharacters stay literal arguments
        id: injection
        continue-on-error: true
        uses: ./
        with:
          command: check; touch /tmp/relaybaton-injected
      - name: assert the injection attempt failed and ran nothing
        env:
          OUTCOME: ${{ steps.injection.outcome }}
        run: |
          test "$OUTCOME" = failure
          test ! -e /tmp/relaybaton-injected
